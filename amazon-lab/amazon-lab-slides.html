<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>c-ECO | Amazon Lab — Pitch Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2b3c;--gold:#c5a059;--gold-light:#e8d5a3;--bg:#f4f7f9;--white:#ffffff;--text:#1a1a1a;--text-muted:#888888;--border:#e0e0e0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:100%;max-width:640px;background:var(--white);border:1px solid var(--border);border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.06);}
.header{display:flex;align-items:center;gap:12px;padding:24px 32px;border-bottom:2px solid var(--gold);}
.logo{width:36px;height:36px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold);font-weight:300;flex-shrink:0;}
.title{font-family:'Libre Baskerville',serif;font-size:14px;font-weight:700;color:var(--navy);line-height:1.2;}
.sub{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.body{background:linear-gradient(135deg,var(--navy) 0%,#2c3e50 100%);color:#fff;padding:44px 32px;}
.body h1{font-family:'Libre Baskerville',serif;font-size:26px;line-height:1.3;margin-bottom:14px;}
.body p{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.7;max-width:480px;}
.back{display:inline-block;margin-top:26px;color:var(--gold-light);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;text-decoration:none;border-bottom:1px solid var(--gold-light);padding-bottom:3px;}
.footer{display:flex;justify-content:space-between;padding:14px 32px;font-size:10px;color:var(--text-muted);}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">Σ</div>
    <div><div class="title">c-ECO</div><div class="sub">Amazon Living Lab</div></div>
  </div>
  <div class="body">
    <h1>Temporarily unavailable</h1>
    <p>This material has been withdrawn from public access pending intellectual-property, authorship, versioning, and publication review.</p>
    <a class="back" href="/">Return to c-ECO</a>
  </div>
  <div class="footer">
    <span>Johann Christian Hasse Foundation</span>
    <span>contact@c-eco.org</span>
  </div>
</div>
</body>
</html>
