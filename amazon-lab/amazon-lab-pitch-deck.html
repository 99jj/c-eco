<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>c-ECO Amazon Lab — Pitch Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8954a;--gold-light:#d4b896;--stone-950:#0c0a09;--stone-900:#1c1917;--stone-600:#57534e;--stone-400:#a8a29e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,var(--stone-950) 0%,var(--stone-900) 100%);color:#e7e5e4;font-size:11pt;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;position:relative;}
h1,.serif{font-family:'Playfair Display',serif;}
.logo-fixed{position:absolute;top:40px;right:80px;display:flex;align-items:center;gap:8px;}
.logo-sigma{width:28px;height:28px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold);}
.logo-text{font-size:8px;text-transform:uppercase;letter-spacing:0.2em;color:var(--stone-400);font-weight:600;}
.slide-num{position:absolute;top:40px;left:80px;font-size:10px;text-transform:uppercase;letter-spacing:0.3em;color:var(--stone-600);font-weight:600;}
.gold-line{width:60px;height:2px;background:var(--gold);margin:20px 0;}
.label{display:inline-block;padding:4px 12px;border:1px solid var(--gold);color:var(--gold);font-size:9px;text-transform:uppercase;letter-spacing:0.2em;font-weight:600;margin-bottom:16px;}
h1{font-size:38px;line-height:1.2;margin-bottom:16px;max-width:700px;}
p{font-size:14px;color:var(--stone-400);max-width:560px;line-height:1.7;}
.back{display:inline-block;margin-top:34px;color:var(--gold-light);font-size:10px;text-transform:uppercase;letter-spacing:0.12em;text-decoration:none;border-bottom:1px solid var(--gold-light);padding-bottom:3px;}
.slide-footer{position:absolute;bottom:40px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:8px;color:var(--stone-600);text-transform:uppercase;letter-spacing:0.15em;}
</style>
</head>
<body>
  <div class="slide-num">Amazon Living Lab</div>
  <div class="logo-fixed"><div class="logo-sigma">Σ</div><span class="logo-text">c-ECO</span></div>

  <div class="label">Notice</div>
  <h1>Temporarily unavailable</h1>
  <div class="gold-line"></div>
  <p>This material has been withdrawn from public access pending intellectual-property, authorship, versioning, and publication review.</p>
  <a class="back" href="/">Return to c-ECO</a>

  <div class="slide-footer">
    <span>Johann Christian Hasse Foundation</span>
    <span>contact@c-eco.org</span>
  </div>
</body>
</html>
